name: Verify Workforce Movement Lifecycle Semantics — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Verifies resignation/transfer effective-date lifecycle
# semantics against REAL existing Production rows only — never creates,
# approves, rejects, or mutates any movement/worker/session. See
# scripts/verify-workforce-movement-lifecycle-semantics.mjs for the full
# note. Only aggregate counts + movement/session IDs, dates, and booleans
# are logged — never worker names/CCCD/phone.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-workforce-movement-lifecycle-semantics-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Verify resignation/transfer lifecycle semantics (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/verify-workforce-movement-lifecycle-semantics.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực hiện."
          echo " Không tạo/duyệt/từ chối bất kỳ movement nào."
          echo "=================================================================="
