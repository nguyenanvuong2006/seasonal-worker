name: Diagnose Electronic-Confirmation Google Auth — PRODUCTION

# READ-ONLY diagnostic (2026-09). Never writes to the database, never
# mutates any resource. Traces candidate_documents / merge_job_records /
# merge_jobs for the electronic-confirmation ("Hồ sơ xác nhận điện tử")
# candidate-document generation path — status counts, recent rows, FAILED
# rows in the last 30 days, and the linked merge_job_records' actual
# error_code/error_message. Never selects candidate PII — see
# scripts/diagnose-econf-google-auth.mjs for exactly what it reads.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-econf-google-auth
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # PROD_DATABASE_URL is scoped to the 'production' GitHub Environment —
    # same boundary every other production-DB read-only script relies on.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose electronic-confirmation Google auth path (read-only — SELECT only, no candidate PII)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/diagnose-econf-google-auth.mjs
