name: Re-verify Worker Lifecycle Features Post-Migration — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Calls the REAL getWorker360Profile()/
# getDepartmentWorkforceRoster() services against Production to confirm
# Worker 360 Profile, "Bộ phận của tôi", and resignation/transfer lists
# still work AND now report the real lifecycle_applied_at state, after the
# effective-lifecycle migration (PR #193) and its reconciliation (PR #195).
# Zero writes anywhere. Never logs worker names/CCCD/phone.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: reverify-worker-lifecycle-features-post-migration-production
  cancel-in-progress: false

jobs:
  reverify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Re-verify Worker 360 Profile / Bộ phận của tôi / resignation-transfer lists (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node --conditions=react-server --import tsx scripts/reverify-worker-lifecycle-features-post-migration.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực hiện."
          echo "=================================================================="
