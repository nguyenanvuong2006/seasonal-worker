name: Activate Operational Codes — PRODUCTION

# EXPLICITLY AUTHORIZED PRODUCTION OPERATIONAL-CODE ACTIVATION WORKFLOW
# --------------------------------------------------------------------
# This workflow performs the one-time transition of operational code allocation
# (Internal DW Code / Fingerprint IT Code) from legacy free-text tracking to the
# canonical database pool (Mission E/F / PR #220).
#
# STRICT PRODUCTION GUARDRAILS:
# 1. Manual trigger ONLY (workflow_dispatch) — no push, pull_request, or schedule.
# 2. Ref MUST be refs/heads/main.
# 3. Confirmation input must equal exactly "ACTIVATE_OPERATIONAL_CODES_PRODUCTION".
# 4. activation_content_checksum must be exactly 64 lowercase hex characters.
# 5. Dedicated concurrency group (cancel-in-progress: false).
# 6. Hostname guard prevents accidental execution against staging database.
# 7. Informational dry-run executed first to output plan state.
# 8. Authoritative in-transaction validation recomputed under advisory locks.
# 9. Read-only post-activation verification ensures all 7 invariants hold.
# 10. No automatic retry or loop logic.

on:
  workflow_dispatch:
    inputs:
      activation_content_checksum:
        description: "Stable activationContentChecksum from the latest reviewed Production dry-run"
        required: true
        type: string
      confirmation:
        description: "Type exactly ACTIVATE_OPERATIONAL_CODES_PRODUCTION"
        required: true
        type: string
      expected_source_commit_sha:
        description: "Exact 40-character main commit SHA reviewed before activation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operational-code-production-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ---- Guardrail A: Branch must be refs/heads/main ----
      - name: "Guardrail A — branch must be main"
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Workflow must be run on refs/heads/main (current ref: ${{ github.ref }})." >&2
            exit 1
          fi
          echo "✅ Branch is refs/heads/main"

      # ---- Guardrail B: Exact confirmation phrase ----
      - name: "Guardrail B — confirmation must match exactly"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "ACTIVATE_OPERATIONAL_CODES_PRODUCTION" ]; then
            echo "❌ Confirmation does not match 'ACTIVATE_OPERATIONAL_CODES_PRODUCTION'." >&2
            exit 1
          fi
          echo "✅ Confirmation matches ACTIVATE_OPERATIONAL_CODES_PRODUCTION"

      # ---- Guardrail C: activation_content_checksum format ----
      - name: "Guardrail C — activation_content_checksum format"
        run: |
          set -euo pipefail
          CHECKSUM="${{ github.event.inputs.activation_content_checksum }}"
          if ! echo "${CHECKSUM}" | grep -qE '^[a-f0-9]{64}$'; then
            echo "❌ activation_content_checksum must be exactly 64 lowercase hexadecimal characters." >&2
            exit 1
          fi
          echo "✅ Checksum format valid: ${CHECKSUM}"

      # ---- Guardrail D: expected_source_commit_sha match (mandatory) ----
      - name: "Guardrail D — expected_source_commit_sha match"
        run: |
          set -euo pipefail
          EXPECTED_SHA="${{ github.event.inputs.expected_source_commit_sha }}"
          if ! echo "${EXPECTED_SHA}" | grep -qE '^[a-f0-9]{40}$'; then
            echo "❌ expected_source_commit_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${EXPECTED_SHA}" != "${HEAD_SHA}" ]; then
            echo "❌ expected_source_commit_sha (${EXPECTED_SHA}) does not match checked-out HEAD (${HEAD_SHA})." >&2
            exit 1
          fi
          echo "✅ Commit SHA matches HEAD exactly (${EXPECTED_SHA})"

      # ---- Guardrail E: Hostname positive allowlist & staging exclusion ----
      - name: "Guardrail E — hostname PROD_DATABASE_URL must match PRODUCTION_DATABASE_HOSTNAME"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Parsed DB host: ${HOST}"

          PROD_ALLOWLIST="${{ vars.PRODUCTION_DATABASE_HOSTNAME }}"
          if [ -z "${PROD_ALLOWLIST}" ]; then
            echo "❌ Biến PRODUCTION_DATABASE_HOSTNAME chưa được thiết lập trong repository/environment variables." >&2
            exit 1
          fi

          if [ "${HOST}" != "${PROD_ALLOWLIST}" ]; then
            echo "❌ Hostname '${HOST}' không khớp PRODUCTION_DATABASE_HOSTNAME '${PROD_ALLOWLIST}' — dừng lại ngay." >&2
            exit 1
          fi
          echo "✅ Production DB hostname khớp allowlist: ${HOST}"

          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      # ---- Step 5: Informational pre-activation dry-run ----
      - name: Informational dry-run activation plan (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node --import tsx scripts/run-operational-code-activation-dryrun.mjs

      # ---- Step 4: Execute operational code activation ----
      # Canonical writer validates plan inside locked transaction before mutating.
      - name: Execute Operational Code Activation
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ACTIVATION_CONTENT_CHECKSUM: ${{ github.event.inputs.activation_content_checksum }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node --conditions react-server --import tsx scripts/run-operational-code-activation.mjs

      # ---- Step 6: Post-activation verification ----
      # Strictly read-only verification of pool rows, assignments, and invariants.
      - name: Post-activation verification (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node --conditions react-server --import tsx scripts/verify-operational-code-activation.mjs
