name: Audit Post-Cutover Merge Job — PRODUCTION

# READ-ONLY diagnostic for the HTML_PDF Production engine cutover (2026-09).
# Never writes to the database, never mutates GCP resources, never invokes
# the worker. Finds the most recently created merge_jobs row (or one named by
# job_id) and reports engine/status/frozen-snapshot fields, cross-checked
# against the currently PUBLISHED template version — see
# scripts/audit-post-cutover-merge-job.mjs for exactly what it reads. Never
# selects candidate PII (no daily_applications join, no source_record_id).

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Audit this specific merge_jobs.id (UUID). Leave blank to audit the most recently created job.'
        required: false
        type: string
      since:
        description: 'Only consider jobs created at/after this ISO timestamp (e.g. 2026-09-07T06:20:00Z). Ignored if job_id is set.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: audit-post-cutover-merge-job
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    # PROD_DATABASE_URL is scoped to the 'production' GitHub Environment —
    # same boundary every other production-DB read-only script relies on.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Audit post-cutover merge job (read-only — SELECT only, no PII)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          JOB_ID: ${{ inputs.job_id }}
          SINCE: ${{ inputs.since }}
        run: node scripts/audit-post-cutover-merge-job.mjs
