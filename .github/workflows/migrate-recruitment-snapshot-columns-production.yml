name: Migrate recruitment_requests Snapshot Columns (Hotfix) — PRODUCTION

# CHỈ chạy migrations/2026-09-09-recruitment-requests-snapshot-columns-only.sql
# (4 câu ADD COLUMN IF NOT EXISTS) qua scripts/run-recruitment-snapshot-columns-migration.mjs
# — KHÔNG chạy schema.sql, KHÔNG chạy migration nào khác, KHÔNG backfill/
# recompute business data. Xem docblock của migration file để biết đầy đủ
# root cause + lý do phạm vi hẹp hơn migration gốc 2026-08-19.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_confirmed:
        description: 'Đã tạo snapshot/backup Neon production TRƯỚC KHI chạy workflow này?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-recruitment-snapshot-columns-production
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy migration." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Guardrail — backup phải được xác nhận trước
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.backup_confirmed }}" != "true" ]; then
            echo "❌ Chưa xác nhận đã tạo backup/snapshot — dừng lại." >&2
            exit 1
          fi
          echo "✅ Backup đã được xác nhận (theo lời khai người chạy workflow)."

  migrate:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Run recruitment_requests snapshot columns hotfix (PRODUCTION — scoped, additive-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/run-recruitment-snapshot-columns-migration.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Đã thêm 4 cột snapshot vào recruitment_requests trên PRODUCTION."
          echo " KHÔNG backfill, KHÔNG recompute male_balance/female_balance/total_balance."
          echo " Đó vẫn là quyết định riêng — xem migrations/2026-08-19-recruitment-snapshot-reconciliation.sql."
          echo "=================================================================="
