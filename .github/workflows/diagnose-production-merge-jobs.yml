name: Diagnose Stuck Production Merge Jobs

# READ-ONLY diagnostic — never writes to the database, never mutates GCP
# resources, never invokes the worker. Investigates why real merge_jobs rows
# are stuck QUEUED/PROCESSING (or recently FAILED) instead of reaching
# COMPLETED. Reads only queue/lease/error diagnostics from merge_jobs +
# merge_job_records (see scripts/diagnose-stuck-merge-jobs.mjs) — never
# candidate PII (no daily_applications join, no source_record_id selected).
# Then correlates by job ID against Cloud Run production logs.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-production-merge-jobs
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: ${{ vars.GCP_RUN_SERVICE_PRODUCTION || 'seasonal-worker-pdf-production' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # PROD_DATABASE_URL + GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_SERVICE_ACCOUNT
    # are scoped to the 'production' GitHub Environment — same boundary
    # migrate-production.yml / deploy-worker-production.yml already rely on.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose stuck merge jobs (read-only — SELECT only, no PII)
        id: diagnose
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/diagnose-stuck-merge-jobs.mjs | tee /tmp/diagnosis.json

      - name: Extract job IDs for log correlation (non-sensitive UUIDs only)
        id: jobids
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const lines = fs.readFileSync('/tmp/diagnosis.json', 'utf8').split('\n').filter(Boolean);
            const ids = new Set();
            for (const line of lines) {
              try {
                const obj = JSON.parse(line);
                if (obj.event === 'jobs_of_interest') {
                  for (const j of obj.jobs) ids.add(j.id);
                }
              } catch {}
            }
            fs.writeFileSync('/tmp/job_ids.txt', [...ids].join('\n'));
            console.log('job_count=' + ids.size);
          "
          cat /tmp/job_ids.txt || true

      - name: Authenticate to Google Cloud
        if: always()
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: always()
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: "Read Cloud Run production logs correlated by job ID (best-effort, read-only)"
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s /tmp/job_ids.txt ]; then
            echo "ℹ️  Không có job nào đáng chẩn đoán (không có job QUEUED/PROCESSING/FAILED gần đây) — bỏ qua đọc log."
            exit 0
          fi
          while IFS= read -r JOB_ID; do
            [ -z "${JOB_ID}" ] && continue
            echo ""
            echo "=== Logs cho jobId=${JOB_ID} ==="
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE}\" AND jsonPayload.jobId=\"${JOB_ID}\"" \
              --project="${PROJECT_ID}" \
              --freshness=7d \
              --order=asc \
              --limit=200 \
              --format='table(timestamp, jsonPayload.event, jsonPayload.stage, jsonPayload.error)' \
              2>&1 || echo "⚠️  Không đọc được log cho job này (có thể thiếu quyền logging.logEntries.list / logging.viewer, hoặc không có log)."
          done < /tmp/job_ids.txt
