name: Diagnose Headcount Gender Reconciliation — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY (2026-09, AI Copilot drill-down gap hardening) —
# investigates the real Production discrepancy reported via
# get_current_headcount (542 total, 186 male, 355 female — 1 unaccounted).
# Zero writes anywhere: only SELECT, never touches worker_profiles.gender or
# any other business row. Uses the SAME canonical ACTIVE + gender
# classification functions the AI Copilot tools themselves use — never a
# reimplementation. See scripts/diagnose-headcount-gender-reconciliation.ts
# for the full privacy/scope note.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-headcount-gender-reconciliation-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose headcount gender reconciliation (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node --import tsx scripts/diagnose-headcount-gender-reconciliation.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Chẩn đoán READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực"
          echo " hiện. worker_profiles.gender KHÔNG bị sửa."
          echo "=================================================================="
