name: Bootstrap schema_migrations Ledger — PRODUCTION

# Dedicated, narrowly-scoped bootstrap for migrations/2026-09-12-schema-migrations-ledger.sql
# ONLY — never any other migration, never an operator-supplied migration id.
# This exists because the canonical single-migration workflow
# (migrate-single-production.yml) validates every migration_id against
# scripts/migration-manifest.mjs, and the ledger bootstrap file is
# deliberately excluded from that manifest (governance infrastructure, not
# a business migration — see scripts/migration-manifest.mjs's own
# docblock). scripts/bootstrap-schema-migrations-ledger.mjs takes NO
# migration id/path argument — the fixed filename is the safety boundary —
# and invokes the same canonical runMigration() primitive every other
# migration runner in this repo uses. No second ledger/checksum mechanism.
#
# BACKUP: owner has explicitly WAIVED backup for this run (migration only
# creates one new governance table + one index, touches zero business
# tables/rows). This workflow logs BACKUP_DECISION=WAIVED_BY_OWNER — it
# never claims to have verified a backup itself.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_waived_by_owner:
        description: "Chủ hệ thống ĐÃ CHỦ ĐỘNG CHỌN KHÔNG tạo backup trước khi chạy workflow này (migration chỉ tạo bảng governance, không chạm bảng nghiệp vụ)?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootstrap-schema-migrations-ledger-production
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy bootstrap." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Guardrail — chủ hệ thống phải CHỦ ĐỘNG xác nhận waiver backup
        env:
          BACKUP_WAIVED: ${{ github.event.inputs.backup_waived_by_owner }}
        run: |
          set -euo pipefail
          if [ "$BACKUP_WAIVED" != "true" ]; then
            echo "❌ Chưa xác nhận rằng chủ hệ thống chủ động chọn waive backup — dừng lại. Không tự suy diễn quyết định này." >&2
            exit 1
          fi
          echo "⚠️  BACKUP_DECISION=WAIVED_BY_OWNER — chủ hệ thống đã CHỦ ĐỘNG CHỌN không tạo backup trước lần chạy này."
          echo "⚠️  Đây là quyết định của chủ hệ thống, được ghi nhận lại, KHÔNG phải hệ thống tự xác nhận có backup."

  bootstrap:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Bootstrap schema_migrations ledger (PRODUCTION — governance-only, fixed file, no business writes)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APPLIED_BY: ${{ github.actor }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/bootstrap-schema-migrations-ledger.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Đã bootstrap bảng schema_migrations + index schema_migrations_applied_at_idx"
          echo " (governance-only, idempotent). KHÔNG chạm bảng nghiệp vụ nào."
          echo " BACKUP_DECISION=WAIVED_BY_OWNER — chủ hệ thống đã chủ động chọn"
          echo " không tạo backup trước lần chạy này (ghi nhận lại, không phải"
          echo " hệ thống tự xác nhận có backup)."
          echo "=================================================================="
