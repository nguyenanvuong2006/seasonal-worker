name: Diagnose Electronic-Confirmation Blank PDF — PRODUCTION

# READ-ONLY diagnostic (2026-09) — investigates the "blank PDF viewer" defect
# reported for the single authorized candidate_document
# (9bd3e051-c9f5-48b7-b495-dd73db8a9340). Verifies whether the STORED
# ARTIFACT itself is valid (exists, non-empty, valid PDF signature/structure,
# sha256 matches) via both the local storage credential AND the new worker
# fallback endpoint (POST /read-stored-pdf). Never writes to the database,
# never uploads/regenerates a PDF, never calls the candidate-facing PDF
# route (which would advance ISSUED -> VIEWED on this real document) — the
# worker endpoint it verifies is a separate, session-less, status-mutation-
# free artifact fetch.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: diagnose-econf-blank-pdf
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: ${{ vars.GCP_RUN_SERVICE_PRODUCTION || 'seasonal-worker-pdf-production' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve production worker URL
        id: worker-url
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')
          if [ -z "${URL}" ]; then
            echo "ERROR: Cloud Run service URL is empty." >&2
            exit 1
          fi
          echo "✅ Worker production: ${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Get Cloud Run ID token (audience = worker URL)
        id: worker-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.worker-url.outputs.url }}
          id_token_include_email: true

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: "Chẩn đoán sâu — kiểm tra trực tiếp phản hồi thật từ Google OAuth token endpoint"
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.PROD_GOOGLE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::${GOOGLE_CLIENT_ID}"
          echo "::add-mask::${GOOGLE_CLIENT_SECRET}"
          echo "::add-mask::${GOOGLE_REFRESH_TOKEN}"
          echo "GOOGLE_CLIENT_ID length: ${#GOOGLE_CLIENT_ID}"
          echo "GOOGLE_CLIENT_SECRET length: ${#GOOGLE_CLIENT_SECRET}"
          echo "GOOGLE_REFRESH_TOKEN length: ${#GOOGLE_REFRESH_TOKEN}"
          HTTP_STATUS=$(curl -s -o /tmp/token_response.json -w "%{http_code}" \
            -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${GOOGLE_CLIENT_ID}" \
            -d "client_secret=${GOOGLE_CLIENT_SECRET}" \
            -d "refresh_token=${GOOGLE_REFRESH_TOKEN}" \
            -d "grant_type=refresh_token")
          echo "HTTP status: ${HTTP_STATUS}"
          # Google's OAuth error responses never echo back client_secret/refresh_token —
          # safe to print verbatim. access_token would only appear on success (200), which
          # we still must not print — mask that key's value defensively either way.
          node -e "
            const fs = require('fs');
            const body = JSON.parse(fs.readFileSync('/tmp/token_response.json', 'utf8'));
            if (body.access_token) body.access_token = '[redacted]';
            console.log(JSON.stringify(body));
          "

      - name: Diagnose stored PDF artifact — local credential AND worker fallback (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STORAGE_PROVIDER: google_drive
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.PROD_GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.PROD_GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          PDF_MERGE_WORKER_URL: ${{ steps.worker-url.outputs.url }}
          MERGE_WORKER_SECRET: ${{ secrets.PROD_MERGE_WORKER_SECRET }}
          WORKER_ID_TOKEN: ${{ steps.worker-auth.outputs.id_token }}
          CANDIDATE_DOCUMENT_ID: "9bd3e051-c9f5-48b7-b495-dd73db8a9340"
        run: node --import tsx scripts/diagnose-econf-blank-pdf.ts
