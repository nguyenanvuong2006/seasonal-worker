name: Diagnose Worker 360 Profile Endpoint Error — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY (Worker 360 Profile production incident, "Lỗi tải hồ sơ")
# — calls the REAL getWorker360Profile() service against real Production
# workerIds to reproduce the exact failure. Zero writes anywhere: only
# SELECT, via the real read-only service (see read-only-audit.test.ts).
# See scripts/diagnose-worker-360-profile-endpoint-error.ts for the full
# note, including why --conditions=react-server is required.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-worker-360-profile-endpoint-error-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Reproduce the Worker 360 Profile endpoint error (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node --conditions=react-server --import tsx scripts/diagnose-worker-360-profile-endpoint-error.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Chẩn đoán READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực"
          echo " hiện. Không có bảng dữ liệu nghiệp vụ nào bị sửa."
          echo "=================================================================="
