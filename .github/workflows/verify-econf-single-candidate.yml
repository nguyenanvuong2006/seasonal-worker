name: Verify Electronic-Confirmation — Single Candidate (PRODUCTION)

# ONE-TIME operational verification (2026-09) — completes the end-to-end
# proof PR #162 left "PARTIALLY verified": selects ONE real, controlled
# production candidate and drives them through
# scripts/verify-econf-single-candidate.ts up to and including
# candidate_documents.status = READY. NEVER issues/sends the document and
# NEVER confirms on behalf of the candidate.
#
# dry_run=true (default): read-only candidate/template/engine selection
# only — zero writes, no Google Cloud auth needed. Always run this first.
# dry_run=false: performs the real write sequence (creates ONE merge job +
# ONE candidate_documents row, triggers the Cloud Run worker via THIS
# workflow's own WIF identity — the same one deploy-worker-production.yml
# already uses successfully to invoke this exact service — polls to
# completion, finalizes to READY). Requires confirm=PRODUCTION.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (chỉ bắt buộc khi dry_run=false)'
        required: false
        type: string
      dry_run:
        description: "true = chỉ chọn ứng viên/template, KHÔNG ghi gì. false = thực thi thật."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-econf-single-candidate
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: ${{ vars.GCP_RUN_SERVICE_PRODUCTION || 'seasonal-worker-pdf-production' }}

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: "Guardrail — confirm=PRODUCTION bắt buộc khi dry_run=false"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" == "false" ] && [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ dry_run=false yêu cầu confirm phải ĐÚNG 'PRODUCTION' — dừng lại." >&2
            exit 1
          fi
          echo "✅ Guardrail OK (dry_run=${{ github.event.inputs.dry_run }})."

  verify:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ github.event.inputs.dry_run == 'false' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Resolve production worker URL
        if: ${{ github.event.inputs.dry_run == 'false' }}
        id: worker-url
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')
          if [ -z "${URL}" ]; then
            echo "ERROR: Cloud Run service URL is empty." >&2
            exit 1
          fi
          echo "✅ Worker production: ${URL}"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Get Cloud Run ID token (audience = worker URL)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        id: worker-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.worker-url.outputs.url }}
          id_token_include_email: true

      - name: Run verification (dry_run=${{ github.event.inputs.dry_run }})
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          MERGE_WORKER_SECRET: ${{ secrets.PROD_MERGE_WORKER_SECRET }}
          PDF_MERGE_WORKER_URL: ${{ steps.worker-url.outputs.url }}
          WORKER_ID_TOKEN: ${{ steps.worker-auth.outputs.id_token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node --import tsx scripts/verify-econf-single-candidate.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Verification xong (dry_run=${{ github.event.inputs.dry_run }})."
          echo " Script CHỈ dừng ở READY — không phát hành, không tự xác nhận thay ứng viên."
          echo "=================================================================="
