name: Migrate Single Migration (Canonical) — PRODUCTION

# CANONICAL single-migration workflow (Mission B section 14). Runs exactly
# ONE migration file, selected by the operator at dispatch time, through
# scripts/run-migration.mjs -> scripts/lib/migration-ledger.mjs's
# runMigration() (checksum-guarded, advisory-locked, ledger-recorded).
#
# The migration_id is validated against scripts/migration-manifest.mjs
# BEFORE any DB connection is made: unknown filenames, path traversal,
# tombstoned, superseded, productionAllowed=false, and non-transactionSafe
# entries are all refused. This is the PREFERRED path for any NEW migration
# going forward — it does NOT replace the 6 existing scoped runners
# (Document Merge, AI Action Proposals, AI Copilot Conversations, Electronic
# Confirmation, Recruitment Snapshot, Workforce Lifecycle), which keep their
# own dedicated workflows and hard-won, incident-driven verification logic.
#
# BACKUP: this workflow does NOT verify a backup was taken — it can only
# record what the operator told it. backup_confirmed=true means the operator
# says a backup WAS taken; backup_waived=true means the operator explicitly
# chose to skip one. Exactly one of the two must be true.

on:
  workflow_dispatch:
    inputs:
      migration_id:
        description: "Tên file migration CHÍNH XÁC trong migrations/ (vd: 2026-xx-yy-name.sql)"
        required: true
        type: string
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_confirmed:
        description: "Operator ĐÃ tạo backup trước khi chạy migration này?"
        required: true
        type: boolean
        default: false
      backup_waived:
        description: "Operator CHỦ ĐỘNG CHỌN KHÔNG tạo backup (rủi ro do họ chấp nhận)?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-single-production
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    outputs:
      backup_decision: ${{ steps.backup-decision.outputs.backup_decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy migration." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Guardrail — chính xác một trong backup_confirmed / backup_waived phải = true
        id: backup-decision
        run: |
          set -euo pipefail
          CONFIRMED="${{ github.event.inputs.backup_confirmed }}"
          WAIVED="${{ github.event.inputs.backup_waived }}"
          if [ "$CONFIRMED" == "$WAIVED" ]; then
            echo "❌ Phải chọn ĐÚNG MỘT trong backup_confirmed hoặc backup_waived (không được cả hai true, không được cả hai false)." >&2
            exit 1
          fi
          if [ "$CONFIRMED" == "true" ]; then
            echo "backup_decision=CONFIRMED_BY_OPERATOR" >> "$GITHUB_OUTPUT"
            echo "✅ BACKUP_DECISION=CONFIRMED_BY_OPERATOR"
          else
            echo "backup_decision=WAIVED_BY_OWNER" >> "$GITHUB_OUTPUT"
            echo "⚠️  BACKUP_DECISION=WAIVED_BY_OWNER — operator chủ động chọn không tạo backup."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guardrail — migration_id phải hợp lệ trong manifest (không path traversal, không tombstoned/superseded/productionAllowed=false)
        env:
          MIGRATION_ID: ${{ github.event.inputs.migration_id }}
        run: node scripts/ci/validate-migration-id.mjs

  migrate:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Run canonical migration runner
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          MIGRATION_ID: ${{ github.event.inputs.migration_id }}
          BACKUP_DECISION: ${{ needs.guardrails.outputs.backup_decision }}
          APPLIED_BY: ${{ github.actor }}
          APP_COMMIT_SHA: ${{ github.sha }}
          MIGRATION_NOTES: "workflow_dispatch via migrate-single-production.yml"
        run: node scripts/run-migration.mjs
