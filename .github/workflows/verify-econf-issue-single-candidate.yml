name: Verify Electronic-Confirmation — Issue Single Candidate (PRODUCTION)

# ONE-TIME operational action (2026-09) — issues (READY -> ISSUED) the exact
# ONE candidate_document PR #164 drove to READY
# (9bd3e051-c9f5-48b7-b495-dd73db8a9340), continuing the individual-candidate
# delivery flow verification into the issue/candidate-access phase. Pure DB
# write (same atomic CAS UPDATE the real issue route uses) — no Cloud Run
# worker or Google Cloud auth involved. Requires confirm=PRODUCTION.
#
# NEVER views the candidate-facing PDF and NEVER confirms on the candidate's
# behalf — see scripts/verify-econf-issue-single-candidate.ts's guardrails.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-econf-issue-single-candidate
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: "Guardrail — confirm=PRODUCTION bắt buộc"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ confirm phải ĐÚNG 'PRODUCTION' — dừng lại." >&2
            exit 1
          fi
          echo "✅ Guardrail OK."

  issue:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Issue the single authorized candidate_document
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          CANDIDATE_DOCUMENT_ID: "9bd3e051-c9f5-48b7-b495-dd73db8a9340"
        run: node --import tsx scripts/verify-econf-issue-single-candidate.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Đã phát hành (READY -> ISSUED) đúng 1 candidate_document."
          echo " Script KHÔNG xem PDF thay ứng viên, KHÔNG xác nhận thay ứng viên."
          echo "=================================================================="
