name: Diagnose DW Cũ Template HTML/PDF Eligibility — PRODUCTION

# READ-ONLY diagnostic (2026-09, Defect 4) — investigates "Template này
# chưa được bật chế độ HTML/PDF." blocking candidate-document generation
# for DW cũ. Zero writes: only SELECTs mergeTemplates + mergeTemplateVersions.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-dw-old-template-eligibility
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose DW cũ template eligibility (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node --import tsx scripts/diagnose-dw-old-template-eligibility.ts
