name: Verify Electronic-Confirmation Production Evidence — READ-ONLY

# STRICTLY READ-ONLY (2026-09) — verifies the candidate_document /
# document_confirmations / audit_logs evidence for the one real document the
# candidate has now genuinely confirmed via the production browser flow
# (9bd3e051-c9f5-48b7-b495-dd73db8a9340). Zero writes anywhere: no DB insert/
# update, no storage access, no confirm/issue/reissue route ever called.
# Recomputes the canonical evidence hash (and HMAC, if the secret is
# available to this workflow) using the SAME production verification
# functions confirm/route.ts itself uses — never a reimplementation.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-econf-production-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Verify production evidence (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          # May not be configured as a GitHub secret (it's a Vercel-only env
          # var per evidence-secret.ts's docblock) — if empty, the script
          # skips HMAC re-verification rather than reporting a false
          # negative. SHA-256 canonical-hash verification never needs it.
          DOCUMENT_EVIDENCE_SECRET: ${{ secrets.PROD_DOCUMENT_EVIDENCE_SECRET }}
          CANDIDATE_DOCUMENT_ID: "9bd3e051-c9f5-48b7-b495-dd73db8a9340"
        run: node --import tsx scripts/verify-econf-production-evidence.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Xác minh READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực hiện."
          echo "=================================================================="
