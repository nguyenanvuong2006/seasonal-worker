name: Diagnose DW Cũ Checkbox Fields — PRODUCTION

# READ-ONLY diagnostic (2026-09). Never writes to the database, never
# mutates any resource. Compares the DW Cũ (Tài liệu A) and DW Mới
# (Tài liệu B) templates' merge_template_versions / merge_template_fields
# rows — reports version metadata, live field mappings, and bounded
# checkbox-field snippets from html_body. Never selects candidate data —
# see scripts/diagnose-dw-cu-checkbox-fields.mjs for exactly what it reads.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-dw-cu-checkbox-fields
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # PROD_DATABASE_URL is scoped to the 'production' GitHub Environment —
    # same boundary every other production-DB read-only script relies on.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose DW Cũ vs DW Mới checkbox fields (read-only — SELECT only, no candidate data)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/diagnose-dw-cu-checkbox-fields.mjs
