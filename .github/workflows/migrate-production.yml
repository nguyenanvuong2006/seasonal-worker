name: Migrate Document Merge DB — PRODUCTION

# CHỈ chạy danh sách migration Document Merge do
# scripts/run-document-merge-migrations.mjs định nghĩa (xem DOCUMENT_MERGE_MIGRATIONS
# trong file đó để biết số lượng & thứ tự HIỆN TẠI — không lặp lại con số ở
# đây nữa vì nó đã lỗi thời ít nhất 1 lần trước khi sửa comment này) — KHÔNG
# chạy schema.sql, KHÔNG chạy migration của tính năng khác. Không seed dữ
# liệu test/verification. KHÔNG publish template, KHÔNG đổi
# DOCUMENT_MERGE_ENGINE (workflow này không chạm tới Vercel).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_confirmed:
        description: 'Đã tạo snapshot/backup Neon production TRƯỚC KHI chạy workflow này?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy migration." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Guardrail — backup phải được xác nhận trước
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.backup_confirmed }}" != "true" ]; then
            echo "❌ Chưa xác nhận đã tạo backup/snapshot — dừng lại." >&2
            echo "   Tạo snapshot/branch Neon HOẶC pg_dump theo docs/PRODUCTION-DEPLOY.md mục 2 TRƯỚC, rồi chạy lại workflow với backup_confirmed=true." >&2
            exit 1
          fi
          echo "✅ Backup đã được xác nhận (theo lời khai người chạy workflow — vẫn nên kiểm tra thủ công snapshot thực sự tồn tại)."

  migrate:
    needs: guardrails
    runs-on: ubuntu-latest
    # Secret PROD_DATABASE_URL CHỈ nằm trong scope environment 'production' —
    # đây là ranh giới an toàn thật (GitHub Environment secret scoping), không
    # chỉ là quy ước đặt tên: job này KHÔNG THỂ đọc được STAGING_DATABASE_URL
    # dù có cố tình tham chiếu, vì secret đó thuộc environment 'staging' khác.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL — kiểm tra secret có đúng định dạng connection string không." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"

          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging (${KNOWN_STAGING_HOST}) — dừng lại ngay." >&2
            exit 1
          fi
          if [ -z "${KNOWN_STAGING_HOST}" ]; then
            echo "⚠️  Biến repo 'STAGING_DATABASE_HOSTNAME' chưa cấu hình — bỏ qua so khớp tự động." >&2
            echo "   An toàn thật sự ở đây đến từ GitHub Environment secret scoping (job này chỉ đọc được PROD_DATABASE_URL, không đọc được STAGING_DATABASE_URL dù có cố ý)." >&2
            echo "   Khuyến nghị: set biến repo (Settings → Variables, KHÔNG phải Secrets — hostname không phải bí mật) STAGING_DATABASE_HOSTNAME để bật check này." >&2
          fi

      - name: Run Document Merge migrations (PRODUCTION — scoped, không chạm bảng khác)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/run-document-merge-migrations.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Migration Document Merge đã chạy xong trên PRODUCTION."
          echo " KHÔNG có template nào được publish tự động."
          echo " DOCUMENT_MERGE_ENGINE trên Vercel KHÔNG bị thay đổi bởi workflow này."
          echo "=================================================================="
