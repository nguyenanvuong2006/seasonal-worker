name: Migrate Workforce Movement Effective-Date Lifecycle — PRODUCTION

# CHỈ chạy migrations/2026-09-10-workforce-movement-effective-lifecycle.sql
# (1 ADD COLUMN IF NOT EXISTS trên workforce_movements + 1 UPDATE backfill
# CHỈ cột lifecycle_applied_at cho dòng ĐÃ duyệt cuối cùng + 1 CREATE INDEX
# IF NOT EXISTS + 1 INSERT ON CONFLICT DO NOTHING vào scheduled_jobs) qua
# scripts/run-workforce-movement-effective-lifecycle-migration.mjs — KHÔNG
# chạy schema.sql, KHÔNG chạy migration nào khác, KHÔNG sửa
# employment_sessions/worker_profiles/daily_applications/
# candidate_documents/document_confirmations, KHÔNG duyệt/từ chối/nghỉ
# việc/chuyển bộ phận bất kỳ lao động thật nào.
#
# BACKUP: người vận hành (system owner) đã CHỦ ĐỘNG chọn KHÔNG tạo backup
# trước lần chạy này — quyết định rủi ro CỦA HỌ, không phải do agent tự xác
# nhận. Input dưới đây ghi lại ĐÚNG sự thật đó (backup_waived_by_user).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_waived_by_user:
        description: 'Chủ hệ thống ĐÃ CHỦ ĐỘNG CHỌN KHÔNG tạo backup trước khi chạy workflow này (rủi ro do họ chấp nhận)?'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-workforce-movement-effective-lifecycle-production
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy migration." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Ghi nhận backup ĐÃ BỊ TỪ CHỐI bởi chủ hệ thống (không phải agent tự xác nhận)
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.backup_waived_by_user }}" != "true" ]; then
            echo "❌ Chưa xác nhận rằng chủ hệ thống chủ động từ chối backup — dừng lại. Không tự suy diễn quyết định này." >&2
            exit 1
          fi
          echo "⚠️  BACKUP_CONFIRMED=NO — chủ hệ thống đã CHỦ ĐỘNG CHỌN không tạo backup trước lần chạy này."
          echo "⚠️  Đây là quyết định rủi ro của chủ hệ thống, được ghi nhận lại, KHÔNG phải agent tự xác nhận có backup."

  migrate:
    needs: guardrails
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Run Workforce Movement Effective-Date Lifecycle migration (PRODUCTION — scoped, additive-only, no backup)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/run-workforce-movement-effective-lifecycle-migration.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Đã thêm cột MỚI lifecycle_applied_at trên workforce_movements +"
          echo " backfill CHỈ cho dòng ĐÃ duyệt cuối cùng (additive-only, idempotent)."
          echo " KHÔNG chạm employment_sessions/worker_profiles/daily_applications/"
          echo " candidate_documents/document_confirmations."
          echo " KHÔNG duyệt/từ chối/nghỉ việc/chuyển bộ phận lao động thật nào."
          echo " BACKUP_CONFIRMED=NO — chủ hệ thống đã chủ động từ chối backup"
          echo " trước lần chạy này (ghi nhận lại, không phải agent tự xác nhận)."
          echo "=================================================================="
