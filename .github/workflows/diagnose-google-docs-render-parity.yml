name: Diagnose Google Docs Render Parity — PRODUCTION

# READ-ONLY diagnostic — never writes to the database, never mutates a
# Google Doc, never invokes the worker. Investigates the PREVIEW vs
# real-GOOGLE_DOCS-merge geometry divergence (2026-09): reads the most
# recent GOOGLE_DOCS job's stored metadata (no PII — no source_record_id,
# no daily_applications join) plus the template's Google Doc's own native
# documentStyle (page margins/size) via a read-only Docs API call scoped to
# the documentStyle field mask only (never body.content).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-google-docs-render-parity
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    # PROD_DATABASE_URL + PROD_GOOGLE_* are scoped to the 'production'
    # GitHub Environment — same boundary every other production workflow here
    # relies on.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose Google Docs render parity (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.PROD_GOOGLE_REFRESH_TOKEN }}
        run: node scripts/diagnose-google-docs-render-parity.mjs
