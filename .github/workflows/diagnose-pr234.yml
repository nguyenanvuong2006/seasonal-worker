name: Diagnose PR234 - PRODUCTION
on:
  push:
    branches:
      - feat/effective-dated-question-versioning

permissions:
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Local Migration Validation
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
        run: node scripts/validate-migration-local.mjs > output.txt

      - name: Run Production Diagnostic
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/diagnose-pr234.mjs >> output.txt

      - name: Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment 234 --body-file output.txt
