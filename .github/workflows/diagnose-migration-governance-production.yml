name: Diagnose Migration Governance — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Runs scripts/reconcile-schema-migrations.mjs (migration
# file/manifest/ledger/schema-evidence cross-reference — always exits 0,
# diagnostic report only) and scripts/production-health-check.mjs (table/
# column/index/permission/required-migration probes — exits non-zero only if
# it finds a genuine structural blocker) against Production. Both scripts
# perform SELECT statements only — see their own docblocks and
# scripts/lib/reconciliation.mjs / scripts/lib/schema-probes.mjs for the
# read-only contract. Zero writes anywhere, zero business data in the logs
# beyond aggregate counts already used elsewhere in this repo's diagnostics.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-migration-governance-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Reconcile schema_migrations ledger vs manifest vs schema evidence (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/reconcile-schema-migrations.mjs

      - name: Production health check — table/column/index/required-migration probes (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/production-health-check.mjs
