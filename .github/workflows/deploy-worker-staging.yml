name: Deploy Document Merge Worker — STAGING

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'PDF_RENDER_CONCURRENCY'
        required: false
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '6'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-worker-staging
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE: ${{ vars.GCP_RUN_SERVICE || 'seasonal-worker-pdf-staging' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          # GitHub Actions -> Google Cloud qua Workload Identity Federation.
          # Không dùng service-account JSON key.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build & push image
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/document-merge/worker-staging:${{ github.sha }}"

          echo "Building worker image..."

          docker build \
            -t "${IMAGE}" \
            -f worker/Dockerfile \
            .

          echo "Pushing worker image..."

          docker push "${IMAGE}"

          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy to Cloud Run (STAGING)
        run: |
          set -euo pipefail

          # Runtime service account:
          # seasonal-worker-merge@seasonal-worker-505710.iam.gserviceaccount.com
          #
          # Runtime secrets được đọc trực tiếp từ Google Secret Manager.
          # Không hardcode secret value trong workflow.

          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --service-account "seasonal-worker-merge@seasonal-worker-505710.iam.gserviceaccount.com" \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 3600 \
            --concurrency 80 \
            --no-allow-unauthenticated \
            --set-env-vars "STORAGE_PROVIDER=google_drive,PDF_RENDER_CONCURRENCY=${{ github.event.inputs.concurrency }},MERGE_JOB_BATCH_TTL_DAYS=${{ vars.MERGE_JOB_BATCH_TTL_DAYS || '14' }},MERGE_DEFAULT_RETENTION_YEARS=${{ vars.MERGE_DEFAULT_RETENTION_YEARS || '3' }}" \
            --set-secrets "DATABASE_URL=STAGING_DATABASE_URL:latest,GOOGLE_CLIENT_ID=STAGING_GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=STAGING_GOOGLE_CLIENT_SECRET:latest,GOOGLE_REFRESH_TOKEN=STAGING_GOOGLE_REFRESH_TOKEN:latest,MERGE_WORKER_SECRET=STAGING_MERGE_WORKER_SECRET:latest,GOOGLE_DRIVE_ROOT_FOLDER_ID=STAGING_GOOGLE_DRIVE_ROOT_FOLDER_ID:latest"

      - name: Show service URL
        id: service-url
        run: |
          set -euo pipefail

          URL=$(gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)')

          if [ -z "${URL}" ]; then
            echo "ERROR: Cloud Run service URL is empty."
            exit 1
          fi

          echo "✅ Worker staging: ${URL}"
          echo "POST ${URL}/run (protected)"
          echo "GET  ${URL}/health (protected)"

          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate for Cloud Run smoke test
        id: smoke-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service-url.outputs.url }}
          id_token_include_email: true

      - name: Smoke test health
        run: |
          set -euo pipefail

          URL="${{ steps.service-url.outputs.url }}"
          TOKEN="${{ steps.smoke-auth.outputs.id_token }}"

          if [ -z "${URL}" ]; then
            echo "ERROR: Cloud Run service URL is empty."
            exit 1
          fi

          if [ -z "${TOKEN}" ]; then
            echo "ERROR: Cloud Run ID token is empty."
            exit 1
          fi

          echo "Testing protected endpoint: ${URL}/health"

          RESPONSE=$(curl \
            --fail \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            -H "Authorization: Bearer ${TOKEN}" \
            "${URL}/health")

          echo "Health response: ${RESPONSE}"

          echo "${RESPONSE}" | grep -q '"ok":true' || {
            echo "ERROR: Worker health endpoint did not return ok:true"
            exit 1
          }

          echo "✅ Cloud Run worker health check PASSED"
