name: Rollout PR #114 — Assignment Actor + v12 DRAFT (PRODUCTION, one-off)

# ONE-OFF, MANUALLY-DISPATCHED workflow for the controlled PR #114 Production
# rollout (assignment actor freeze schema, Nguoi_tiep_nhan mapping, v12 layout
# DRAFT). Each dispatch runs EXACTLY ONE of the 3 phases below — never all of
# them. There is no "all" option. Uses the SAME PROD_DATABASE_URL secret (GitHub
# Environment "production") as .github/workflows/migrate-production.yml — no
# new secret introduced, no DB credential ever printed.
#
# This workflow NEVER publishes v12, NEVER changes current_published_version,
# NEVER touches v11's content or mapping_snapshot, NEVER runs DROP/DELETE/mass
# backfill, and NEVER touches Google Drive. See scripts/rollout-pr114-assignment-v12.mjs
# for the actual per-step logic and its own safety checks (schema pre-checks,
# duplicate guards, read-back verification, fail-closed on any unexpected state).

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which SINGLE rollout phase to run — never runs more than one per dispatch"
        required: true
        type: choice
        options:
          - schema
          - mapping
          - v12-draft
      confirm:
        description: 'Gõ chính xác "PRODUCTION" để xác nhận (phân biệt hoa/thường)'
        required: true
        type: string
      backup_confirmed:
        description: "Đã tạo snapshot/backup Neon production TRƯỚC KHI chạy workflow này?"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rollout-pr114-assignment-v12
  cancel-in-progress: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — step phải là 1 trong 3 giá trị hợp lệ (không có "all")
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.step }}" in
            schema|mapping|v12-draft) echo "✅ step hợp lệ: ${{ github.event.inputs.step }}" ;;
            *) echo "❌ step không hợp lệ." >&2; exit 1 ;;
          esac

      - name: Guardrail — input xác nhận phải ĐÚNG "PRODUCTION"
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "PRODUCTION" ]; then
            echo "❌ Input xác nhận không khớp 'PRODUCTION' — dừng lại, không chạy gì." >&2
            exit 1
          fi
          echo "✅ Xác nhận PRODUCTION hợp lệ."

      - name: Guardrail — backup phải được xác nhận trước
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.backup_confirmed }}" != "true" ]; then
            echo "❌ Chưa xác nhận đã tạo backup/snapshot — dừng lại." >&2
            echo "   Tạo snapshot/branch Neon HOẶC pg_dump theo docs/PRODUCTION-DEPLOY.md mục 2 TRƯỚC, rồi chạy lại workflow với backup_confirmed=true." >&2
            exit 1
          fi
          echo "✅ Backup đã được xác nhận (theo lời khai người chạy workflow — vẫn nên kiểm tra thủ công snapshot thực sự tồn tại)."

  rollout:
    needs: guardrails
    runs-on: ubuntu-latest
    # Secret PROD_DATABASE_URL CHỈ nằm trong scope environment 'production' —
    # ranh giới an toàn thật (GitHub Environment secret scoping), giống hệt
    # migrate-production.yml. Job này không đọc được STAGING_DATABASE_URL.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"

          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging (${KNOWN_STAGING_HOST}) — dừng lại ngay." >&2
            exit 1
          fi

      - name: "Run ONLY step=${{ github.event.inputs.step }} (schema | mapping | v12-draft)"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ROLLOUT_STEP: ${{ github.event.inputs.step }}
        run: node scripts/rollout-pr114-assignment-v12.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " step=${{ github.event.inputs.step }} đã chạy xong trên PRODUCTION."
          echo " KHÔNG có template nào được publish. current_published_version KHÔNG đổi."
          echo " v11 KHÔNG bị chạm tới. Không chạy Vercel/Drive từ workflow này."
          echo "=================================================================="
