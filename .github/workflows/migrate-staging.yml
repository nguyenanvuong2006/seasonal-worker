name: Migrate Document Merge DB — STAGING

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Môi trường đích (chỉ STAGING — production bị chặn)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # Environment protection: chỉ ai có quyền truy cập environment 'staging'
    # mới chạy được; DATABASE_URL đọc từ GitHub Environment secret.
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run migrations (STAGING only)
        env:
          # Secret được khai báo ở GitHub → Settings → Environments → staging.
          # KHÔNG nhận DATABASE_URL từ input UI (không cho nhập arbitrary).
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node scripts/run-migrations.mjs

      - name: Verify merge tables
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          node --input-type=module <<'EOF'
          import pg from "pg";
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
          await c.connect();
          const r = await c.query(`
            SELECT
              (SELECT count(*) FROM merge_templates) AS templates,
              (SELECT count(*) FROM merge_template_fields WHERE is_orphaned = false) AS fields,
              (SELECT count(*) FROM merge_template_versions) AS versions,
              (SELECT count(*) FROM document_history) AS history
          `);
          console.log("VERIFY:", JSON.stringify(r.rows[0]));
          await c.end();
          EOF
                # PR5 root-cause hardening: xác minh schema /run-overlay cần NGAY sau migration.
      # Một migration KHÔNG thể "báo thành công" trong khi /run-overlay vẫn kỳ vọng
      # bảng/cột chưa có — bước này fail workflow (exit 1, SCHEMA_MISMATCH) nếu thiếu.
      # Nguồn sự thật DUY NHẤT: src/lib/document-merge/pdf-overlay/required-schema.ts
      # (cùng contract worker /run-overlay dùng — xem scripts/verify-required-schema.mjs).
      - name: Verify required overlay schema (PR5)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node --import tsx scripts/verify-required-schema.mjs
