name: Diagnose Operational Codes — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Runs scripts/diagnose-operational-codes.mjs (legacy DW/
# IT Code inventory: duplicates, active/former holders, prefix/format
# breakdown, mirror consistency — see that script's own docblock) and
# scripts/run-operational-code-activation-dryrun.mjs (the same
# buildActivationPlan() dry-run planner prepareOperationalCodeActivation()
# uses, wired to Production via a plain read-only `pg` client) against
# Production. Both scripts perform SELECT statements only. Zero writes
# anywhere, zero CCCD/phone/full-name in the logs — only opaque
# worker_profiles.id references, operational codes, and aggregate counts.

on:
  workflow_dispatch:
    inputs:
      target_code:
        description: "Mã DW cần chẩn đoán chi tiết (VD: DR23685-D). Mặc định là DR23685-D."
        required: false
        type: string
        default: "DR23685-D"

permissions:
  contents: read

concurrency:
  group: diagnose-operational-codes-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Legacy DW/IT Code inventory (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          TARGET_DW_CODE: ${{ github.event.inputs.target_code || 'DR23685-D' }}
        run: node scripts/diagnose-operational-codes.mjs

      - name: Dry-run activation plan (read-only, no adoption/activation)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: node --import tsx scripts/run-operational-code-activation-dryrun.mjs
