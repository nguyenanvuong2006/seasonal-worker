name: Audit Historical Resignation Reconciliation — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Classifies every Production resignation movement into
# A-E (CORRECT_EFFECTIVE_TERMINATION / HISTORICAL_EARLY_TERMINATION /
# FUTURE_PENDING_EFFECT / INCONSISTENT_STATE / CANNOT_DETERMINE) per the
# historical workforce lifecycle data reconciliation mission (Phase 1). Zero
# writes anywhere. Never logs worker names/CCCD/phone/address — only opaque
# movement/session ids, dates, and structural booleans/counts.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-historical-resignation-reconciliation-production
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Audit historical resignation reconciliation (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/audit-historical-resignation-reconciliation.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực hiện."
          echo " Không sửa/tạo movement hay employment_session nào."
          echo "=================================================================="
