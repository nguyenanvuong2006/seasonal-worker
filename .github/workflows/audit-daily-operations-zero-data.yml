name: Audit Daily Operations Zero Data — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY. Investigates why Nhập mã công nhật / IT Code / Vân
# tay / Báo cơm show zero records for 2026-09-10 — checks whether the
# current reg_date-based query semantics match the routes' own stated
# intent (dw_imported_at date) and whether zero is real data or a
# date/query regression. Zero writes anywhere. No PII in logs — only
# aggregate counts.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: audit-daily-operations-zero-data-production
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Audit Daily Operations zero-data root cause (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node scripts/audit-daily-operations-zero-data.mjs

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực hiện."
          echo "=================================================================="
