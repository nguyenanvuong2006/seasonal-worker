steps:
  - name: Checkout selected branch
    uses: actions/checkout@v4

  - name: Verify no production inputs exist
    shell: bash
    run: |
      set -euo pipefail
      test "${{ github.event.inputs.expected_pages }}" = "6"
      test -f templates/document-merge/trainee-registration/test.html
      test -f worker/Dockerfile
      grep -Fq 'mcr.microsoft.com/playwright:v1.62.1-noble' worker/Dockerfile
      echo "✅ Browser evidence is isolated: no database, Drive, Cloud Run, or production inputs."

  - name: Install application and worker dependencies
    shell: bash
    run: |
      set -euo pipefail
      npm ci --no-audit --no-fund
      npm --prefix worker ci --no-audit --no-fund

  - name: Generate merged canonical HTML via production renderer
    shell: bash
    run: |
      set -euo pipefail
      npm --prefix worker run generate:sample

  - name: Render PDF and capture browser evidence
    shell: bash
    run: |
      set -euo pipefail
      npm --prefix worker run verify:visual -- \
        --html "${EVIDENCE_ROOT}/rendered-sample.html" \
        --expected-pages "${{ github.event.inputs.expected_pages }}" \
        --out "${EVIDENCE_ROOT}/browser-evidence"

  - name: Enforce canonical evidence gate
    shell: bash
    run: |
      set -euo pipefail
      node --input-type=module <<'NODE'
      import { existsSync, readFileSync } from "node:fs";

      const root = process.env.EVIDENCE_ROOT;
      const reportPath = `${root}/browser-evidence/report.json`;
      const report = JSON.parse(readFileSync(reportPath, "utf8"));
      const failures = [];

      if (report.pass !== true) failures.push("report.pass is not true");
      if (report.checks.realPdfPageCount !== 6) failures.push(`PDF pages=${report.checks.realPdfPageCount}, expected 6`);
      if (report.checks.logicalSectionCount !== 6) failures.push(`logical sections=${report.checks.logicalSectionCount}, expected 6`);
      if (report.checks.unresolvedPlaceholderCount !== 0) failures.push(`unresolved placeholders=${report.checks.unresolvedPlaceholderCount}`);
      if (report.checks.horizontalOverflowPx > 1) failures.push(`horizontal overflow=${report.checks.horizontalOverflowPx}px`);
      if (report.checks.blankPages.length !== 0) failures.push(`blank pages=${JSON.stringify(report.checks.blankPages)}`);
      if (report.checks.paginationWarnings.length !== 0) failures.push(`pagination warnings=${JSON.stringify(report.checks.paginationWarnings)}`);
      if (!/^[a-f0-9]{64}$/.test(report.pdf.sha256 ?? "")) failures.push("PDF SHA-256 is missing or invalid");
      if (report.evidence.screenshots.length !== 6) failures.push(`screenshots=${report.evidence.screenshots.length}, expected 6`);
      if (report.browser.playwright !== "1.62.1") failures.push(`Playwright revision=${report.browser.playwright}, expected 1.62.1`);
      if (!report.browser.chromium) failures.push("Chromium revision is missing");

      for (const relative of [
        `${root}/rendered-sample.html`,
        `${root}/browser-evidence/rendered.pdf`,
        `${root}/browser-evidence/report.json`,
        `${root}/browser-evidence/full.png`,
        ...report.evidence.screenshots,
      ]) {
        if (!existsSync(relative)) failures.push(`missing artifact: ${relative}`);
      }

      if (failures.length) {
        console.error("❌ Canonical browser evidence gate failed:\n- " + failures.join("\n- "));
        process.exit(1);
      }
      console.log(JSON.stringify({
        pass: true,
        pdfSha256: report.pdf.sha256,
        realPdfPageCount: report.checks.realPdfPageCount,
        unresolvedPlaceholderCount: report.checks.unresolvedPlaceholderCount,
        paginationWarnings: report.checks.paginationWarnings,
        browser: report.browser,
      }, null, 2));
      NODE

  - name: Upload PDF, screenshots, and report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: trainee-registration-browser-evidence-${{ github.sha }}
      path: ${{ env.EVIDENCE_ROOT }}
      if-no-files-found: error
      retention-days: 30
