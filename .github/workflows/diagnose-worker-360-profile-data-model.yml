name: Diagnose Worker 360 Profile Data Model — PRODUCTION (READ-ONLY)

# STRICTLY READ-ONLY (Worker 360° Profile mission, 2026-09-10, Section 23) — reports aggregate
# counts about the identity graph getWorker360Profile() reads from (worker_profiles,
# employment_sessions, candidate_documents, workforce_movements). Zero writes anywhere: only
# SELECT/COUNT/GROUP BY, never touches any business row. No PII in the logs — aggregate numbers
# only. See scripts/worker-360-profile-production-diagnostic.ts for the full note.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: diagnose-worker-360-profile-data-model-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: "Guardrail — hostname PROD_DATABASE_URL không được khớp staging đã biết"
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          HOST=$(node -e "try { console.log(new URL(process.env.DATABASE_URL).hostname); } catch { console.log(''); }")
          if [ -z "${HOST}" ]; then
            echo "❌ Không parse được hostname từ PROD_DATABASE_URL." >&2
            exit 1
          fi
          echo "✅ Production DB host: ${HOST}"
          KNOWN_STAGING_HOST="${{ vars.STAGING_DATABASE_HOSTNAME }}"
          if [ -n "${KNOWN_STAGING_HOST}" ] && [ "${HOST}" == "${KNOWN_STAGING_HOST}" ]; then
            echo "❌ PROD_DATABASE_URL trỏ ĐÚNG hostname staging — dừng lại ngay." >&2
            exit 1
          fi

      - name: Diagnose Worker 360 Profile data model (read-only)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: node --import tsx scripts/worker-360-profile-production-diagnostic.ts

      - name: Reminder
        run: |
          echo "=================================================================="
          echo " Chẩn đoán READ-ONLY hoàn tất — không có ghi dữ liệu nào được thực"
          echo " hiện. worker_profiles/employment_sessions/candidate_documents/"
          echo " workforce_movements KHÔNG bị sửa."
          echo "=================================================================="
