name: Provision Merge Worker Watchdog — PRODUCTION

# Provisions (create-or-update, idempotent) the Cloud Scheduler job that
# hits the Document Merge PRODUCTION Cloud Run worker's POST /run every 5
# minutes in watchdog mode (no jobId) — the independent stale-job recovery
# actor from the 28-29/08 incident (see
# docs/MERGE-STUCK-PROCESSING-INCIDENT.md). Recovery must not depend on a
# user clicking Merge again or a once-a-day Vercel Hobby cron.
#
# This workflow does NOT invent new provisioning logic — it wraps the
# EXISTING, reviewed scripts/provision-merge-worker-watchdog.sh with the
# same WIF auth pattern already used by deploy-worker-production.yml.
# Creates NO candidate/job data: watchdog-mode /run only reclaims items
# with an expired lease and dispatches the next non-terminal job; it is
# never invoked by this workflow (only Cloud Scheduler invokes /run, on
# its own 5-minute cadence, after this workflow finishes).

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-watchdog-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'asia-southeast1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  # Tên RIÊNG, khớp đúng service deploy-worker-production.yml đã tạo —
  # KHÔNG suy luận tên khác cho watchdog.
  SERVICE: ${{ vars.GCP_RUN_SERVICE_PRODUCTION || 'seasonal-worker-pdf-production' }}

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Guardrail — service name không được chứa "staging"
        run: |
          set -euo pipefail
          SERVICE_LOWER=$(echo "${SERVICE}" | tr '[:upper:]' '[:lower:]')
          if [[ "${SERVICE_LOWER}" == *staging* ]]; then
            echo "❌ GCP_RUN_SERVICE_PRODUCTION chứa 'staging' — dừng lại, đây là watchdog PRODUCTION." >&2
            exit 1
          fi
          echo "✅ Service name OK: ${SERVICE}"

  provision:
    needs: guardrails
    runs-on: ubuntu-latest
    # Cùng ranh giới GitHub Environment 'production' như
    # deploy-worker-production.yml — job này đọc GCP_WORKLOAD_IDENTITY_PROVIDER
    # / GCP_SERVICE_ACCOUNT của môi trường đó, không secret nào khác.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # WIF only — KHÔNG dùng service-account JSON key dài hạn, giống
          # hệt deploy-worker-production.yml.
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure Cloud Scheduler API is enabled
        run: |
          set -euo pipefail
          # Checking enablement (serviceusage.services.list/get) is a far more
          # commonly-granted read permission than enabling a new API
          # (serviceusage.services.enable) — deliberately excluded from this
          # deploying identity's grants in this project, same as
          # deploy-worker-production.yml never attempts to enable any API
          # itself. Only call `enable` (and only fail the run) when the API
          # is actually not already on.
          ENABLED=$(gcloud services list --enabled --project "${PROJECT_ID}" \
            --filter="config.name:cloudscheduler.googleapis.com" \
            --format="value(config.name)")
          if [ -n "${ENABLED}" ]; then
            echo "✅ Cloud Scheduler API already enabled — nothing to do."
          else
            echo "Cloud Scheduler API not yet enabled — attempting to enable it..."
            gcloud services enable cloudscheduler.googleapis.com --project "${PROJECT_ID}"
          fi

      - name: Resolve worker URL + runtime service account (non-secret resource identifiers)
        id: resolve
        run: |
          set -euo pipefail
          # Cùng service account production mà deploy-worker-production.yml
          # dùng để deploy worker — KHÔNG dùng lại service account staging.
          SA="${{ vars.GCP_RUN_SERVICE_ACCOUNT_PRODUCTION || 'seasonal-worker-merge-prod@seasonal-worker-505710.iam.gserviceaccount.com' }}"
          URL=$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')
          if [ -z "${URL}" ]; then
            echo "❌ Không lấy được Cloud Run service URL — worker production đã deploy chưa?" >&2
            exit 1
          fi
          echo "worker_url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "runtime_sa=${SA}" >> "${GITHUB_OUTPUT}"
          echo "✅ worker_url + runtime_sa đã resolve (không phải secret — chỉ định danh resource)."

      - name: Check RUNTIME_SA has roles/run.invoker (read-only, best-effort, never fails the run)
        run: |
          set -uo pipefail
          # This binding is a documented ONE-TIME prerequisite
          # (scripts/provision-merge-worker-watchdog.sh's own trailing note),
          # not something this workflow's identity is meant to grant itself:
          # run.services.setIamPolicy sits in roles/run.admin, deliberately
          # broader than the roles/run.developer-tier grant this deploying
          # identity has for routine deploys (same "read allowed, write
          # reserved for the account owner" boundary already hit on
          # serviceusage.services.enable). Least privilege means NOT
          # widening this identity just to self-grant a one-time binding —
          # so this step only ever reads, and never blocks provisioning the
          # actual scheduler job below even if the read itself is denied or
          # the binding is missing (that would only surface later as a
          # 403 in the scheduler job's own execution history, not here).
          MEMBER="serviceAccount:${{ steps.resolve.outputs.runtime_sa }}"
          POLICY=$(gcloud run services get-iam-policy "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format=json 2>&1)
          if [ $? -ne 0 ]; then
            echo "⚠️  Không đọc được IAM policy (quyền get-iam-policy có thể cũng bị giới hạn) — bỏ qua kiểm tra, tiếp tục provision watchdog. Nếu scheduler job sau này gọi /run bị 403, đây là nơi cần kiểm tra thủ công."
          elif echo "${POLICY}" | grep -q "${MEMBER}"; then
            echo "✅ ${MEMBER} đã có ít nhất 1 role binding trên service — giả định roles/run.invoker đã được cấp theo đúng ghi chú của script (cấp 1 lần)."
          else
            echo "⚠️  Không thấy ${MEMBER} trong IAM policy hiện tại của ${SERVICE}. Scheduler job vẫn sẽ được tạo/update (không mutate IAM ở đây theo nguyên tắc least-privilege), nhưng /run có thể trả 403 cho tới khi 1 người có quyền project chạy: gcloud run services add-iam-policy-binding ${SERVICE} --region ${REGION} --project ${PROJECT_ID} --member=${MEMBER} --role=roles/run.invoker"
          fi

      - name: Provision watchdog (existing script — idempotent create-or-update, no candidate data)
        # continue-on-error: this step can legitimately fail here even when
        # the job already exists and is fully correct (e.g. the deploying
        # identity lacking secretmanager.versions.access — a known, already
        # least-privilege-preserving boundary; see PR #132/#133). The
        # read-only verification steps below are still meaningful and must
        # still run in that case — they check the job GCP actually has, not
        # whether this specific step's write succeeded.
        continue-on-error: true
        env:
          WORKER_URL: ${{ steps.resolve.outputs.worker_url }}
          RUNTIME_SA: ${{ steps.resolve.outputs.runtime_sa }}
          SECRET_NAME: PROD_MERGE_WORKER_SECRET
        run: ./scripts/provision-merge-worker-watchdog.sh --yes

      - name: Verify scheduler job config (schedule/target/OIDC identity/timezone — NEVER httpTarget.headers)
        # Non-fatal: cloudscheduler.jobs.get may itself be restricted for
        # this deploying identity (same pattern hit on 3 other GCP read/write
        # permissions already this session) — don't let that stop the later
        # steps from at least attempting the force-run and its own read.
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud scheduler jobs describe merge-worker-watchdog \
            --location "${REGION}" --project "${PROJECT_ID}" \
            --format='yaml(name,schedule,timeZone,state,httpTarget.uri,httpTarget.httpMethod,httpTarget.oidcToken.serviceAccountEmail,httpTarget.oidcToken.audience)'

      - name: Read last execution result BEFORE force-run (status/lastAttemptTime only — proves auth correctness without ever reading the header value)
        run: |
          set -euo pipefail
          echo "Cloud Scheduler's own status.code after an attempt reflects whether the worker's Authorization check accepted the request — this is how we verify the header is CORRECT without ever looking at what it contains."
          gcloud scheduler jobs describe merge-worker-watchdog \
            --location "${REGION}" --project "${PROJECT_ID}" \
            --format='yaml(lastAttemptTime,status)' || echo "(no attempt has occurred yet — status/lastAttemptTime absent until the first execution)"

      - name: "Force-run exactly one watchdog execution (safe — watchdog mode reclaims/dispatches only, creates no candidate/job data)"
        # Non-fatal: cloudscheduler.jobs.run may also be restricted for this
        # identity. If so, the natural */5 * * * * schedule still fires on
        # its own — the final read step below reports whatever the latest
        # real attempt (forced or organic) shows.
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud scheduler jobs run merge-worker-watchdog \
            --location "${REGION}" --project "${PROJECT_ID}"
          echo "✅ Force-run triggered. Cloud Scheduler executes it asynchronously — waiting briefly before reading the result."
          sleep 15

      - name: Read execution result AFTER force-run (status/lastAttemptTime only)
        id: after-status
        run: |
          set -euo pipefail
          gcloud scheduler jobs describe merge-worker-watchdog \
            --location "${REGION}" --project "${PROJECT_ID}" \
            --format='yaml(lastAttemptTime,status)'
          echo ""
          echo "status absent or code 0 (OK) = the worker returned a clean 2xx. code 16 (UNAUTHENTICATED) or 7 (PERMISSION_DENIED) would specifically mean the header/OIDC identity is wrong. Per Google's standard HTTP-to-gRPC mapping, most OTHER non-zero codes (2=UNKNOWN, 13=INTERNAL, 14=UNAVAILABLE, 4=DEADLINE_EXCEEDED) point at a target/runtime problem, NOT an auth problem — see the direct diagnostic step below for the actual HTTP status and body, which Cloud Scheduler's status.code alone doesn't fully disambiguate."

      - name: Authenticate for direct /run diagnostic call (same identity/audience pattern as the worker's own deploy smoke test)
        if: always()
        id: diag-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.resolve.outputs.worker_url }}
          id_token_include_email: true

      - name: "Diagnose worker /run directly (bypasses Cloud Scheduler's opaque status.code — safe no-op: watchdog mode, no jobId, no candidate data)"
        if: always()
        run: |
          set -uo pipefail
          URL="${{ steps.resolve.outputs.worker_url }}"
          TOKEN="${{ steps.diag-auth.outputs.id_token }}"
          if [ -z "${URL}" ] || [ -z "${TOKEN}" ]; then
            echo "⚠️  Không có URL/token để gọi chẩn đoán trực tiếp — bỏ qua bước này."
            exit 0
          fi
          RESPONSE=$(curl -s -w '\nHTTP_STATUS:%{http_code}' -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${URL}/run")
          echo "Raw /run response (watchdog mode — this call itself is a safe no-op with zero queued jobs in production today):"
          echo "${RESPONSE}"
          echo ""
          echo "This call deliberately sends ONLY the OIDC Authorization header (no X-Merge-Worker-Secret) — it exists to prove Cloud Run IAM/OIDC alone reaches the app, not to exercise the app secret. Expect 401 {\"error\":\"unauthorized\"} here even when the real Scheduler job (which DOES send X-Merge-Worker-Secret) is fully correct — see the before/after status.code reads above for that."
          echo "403/5xx here (instead of the expected 401) would mean Cloud Run IAM itself, or the worker container, is broken — that would be a real problem regardless of the app secret."
